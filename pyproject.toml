[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "secretscan"
version = "0.1.0"
description = "Find API keys, hard-coded passwords, and private keys before you commit."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ethan Ko" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
secretscan = "secretscan.cli:main"

[project.urls]
Homepage = "https://github.com/e-ko123/SecretScanner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
